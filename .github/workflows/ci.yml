name: CI
on:
  push:
    branches: [main, 'wp/**']
  pull_request:
  workflow_dispatch:
permissions:
  # Validation never receives id-token: write; deployment follows successful main CI.
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: true
      - name: Install pinned package manager
        run: npm install --global pnpm@12.5.1
      - name: Install locked Python and CDK CLI dependencies
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile
          pnpm --dir sap-mirror install --frozen-lockfile
          node sap-mirror/scripts/fetch-sap-schemas.mjs
      - name: Lint, type check, tests and synth assertions, secret scan and dependency audits
        run: uv run --locked python scripts/check.py
