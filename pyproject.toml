[project]
name = "aera-be"
version = "0.0.0"
description = "AERA backend and infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib==2.270.0",
    "aws-lambda-powertools==3.35.0",
    "beautifulsoup4==4.15.0",
    "boto3==1.43.100",
    "constructs==10.8.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pypdf==6.19.0",
    "python-ulid==4.0.1",
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock,bedrock-agentcore-control,bedrock-runtime,budgets,comprehend,dynamodb,secretsmanager,ssm,sts,textract]==1.43.100",
    "detect-secrets==1.5.0",
    "moto[dynamodb,events,s3,secretsmanager,sqs,ssm]==5.2.3",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "yamllint==1.38.0",
]

[tool.uv]
package = false
required-version = "==0.12.18"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
norecursedirs = [".git", ".venv", "node_modules", "cdk.out"]
pythonpath = [".", "scripts", "tests"]
testpaths = ["tests", "infra/tests", "services"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
omit = ["*/tests/*"]
